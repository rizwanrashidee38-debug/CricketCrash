
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd Division Cricket League Simulator</title>
    <style>
        :root { --field: #1b5e20; --pitch: #cfb997; --ui-bg: #121212; --accent: #fbc02d; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; margin: 0; text-align: center; }
        .game-wrap { max-width: 950px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 15px; border-top: 5px solid var(--accent); display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .game-wrap { grid-template-columns: 1fr; } }
        .main-pane { background: #151515; padding: 15px; border-radius: 10px; }
        .side-pane { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #333; }
        .scoreboard { background: #000; padding: 20px; border-radius: 10px; margin: 15px 0; border: 1px solid #222; }
        .live-num { font-size: 2.5rem; color: var(--accent); font-weight: bold; }
        .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 400px; margin: 20px auto; }
        .tile { height: 90px; background: var(--field); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; transition: 0.3s; border: 2px solid transparent; }
        .tile:hover { border-color: white; transform: scale(1.03); }
        .log { background: #0a0a0a; height: 140px; overflow-y: auto; padding: 15px; text-align: left; font-family: monospace; border-radius: 5px; font-size: 0.85rem; border-left: 3px solid var(--accent); }
        .hidden { display: none; }
        button, select, input { padding: 12px; margin: 5px; border-radius: 5px; border: none; font-size: 1rem; background: #333; color: #fff; }
        button.action-btn { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; margin-top: 10px; }
        th, td { padding: 8px; border-bottom: 1px solid #333; }
        th { color: var(--accent); }
        .highlight { color: var(--accent); }
    </style>
</head>
<body>

<div class="game-wrap">
    <div class="main-pane">
        <h1>🏏 Division 3 League</h1>
        
        <div id="setup">
            <input type="text" id="pName" placeholder="Your Surname"><br>
            <select id="pTeamSelect">
                <option value="Nagpur Nightriders">Nagpur Nightriders</option>
                <option value="Butibori Blasters">Butibori Blasters</option>
                <option value="Wardha Warriors">Wardha Warriors</option>
                <option value="Hingna Hurricanes">Hingna Hurricanes</option>
                <option value="Umred United">Umred United</option>
                <option value="Kamptee Knights">Kamptee Knights</option>
            </select>
            <select id="pRole">
                <option value="Batsman">Specialist Batsman</option>
                <option value="Bowler">Specialist Bowler</option>
                <option value="All-Rounder">All-Rounder</option>
            </select>
            <select id="pPos">
                <option value="1">Opener (Pos 1)</option>
                <option value="3">Top Order (Pos 3)</option>
                <option value="4">Middle Order (Pos 4)</option>
                <option value="7">Lower Order (Pos 7)</option>
            </select><br><br>
            <button class="action-btn" onclick="initGame()">Register and Generate Fixtures</button>
        </div>

        <div id="gameplay" class="hidden">
            <div id="toss-zone">
                <h3 id="fixture-title">Matchday 1 Loading...</h3>
                <button class="action-btn" onclick="startToss()">Walk Out for Toss</button>
            </div>

            <div id="action-zone" class="hidden">
                <div class="scoreboard">
                    <div id="match-header" class="highlight" style="font-size: 1.1rem; font-weight: bold;"></div>
                    <div id="batting-team" style="font-weight: bold; margin-top: 5px;"></div>
                    <div class="live-num"><span id="sc-runs">0</span> - <span id="sc-wicks">0</span></div>
                    <div id="sc-overs">Overs: 0.0 / 20.0</div>
                    <div id="sc-target" style="color: #ff9800; font-weight: bold; margin-top: 5px;"></div>
                    <hr style="opacity: 0.1">
                    <div id="player-status">Padded up in the pavilion...</div>
                </div>

                <div class="tile-grid" id="tiles">
                    <div class="tile" onclick="playBall()">?</div>
                    <div class="tile" onclick="playBall()">?</div>
                    <div class="tile" onclick="playBall()">?</div>
                    <div class="tile" onclick="playBall()">?</div>
                </div>
                
                <button id="sim-btn" class="action-btn hidden" onclick="simRest()">Innings Complete? Fast Forward</button>
            </div>

            <div class="log" id="log">Fixtures set. The tournament schedule is locked in.</div>
        </div>
    </div>

    <div class="side-pane">
        <h3>📋 League Standings</h3>
        <table>
            <thead>
                <tr><th>Club Team</th><th>P</th><th>Pts</th></tr>
            </thead>
            <tbody id="standings-body">
                <tr><td colspan="3">Awaiting league entry...</td></tr>
            </tbody>
        </table>
        <div style="margin-top: 20px; text-align: left; font-size: 0.85rem; color: #aaa;">
            <h4>🏆 Your Target (Div 3):</h4>
            <span id="target-desc">Select role...</span><br>
            Current Runs: <b id="stat-runs">0</b><br>
            Current Wickets: <b id="stat-wicks">0</b>
        </div>
    </div>
</div>

<script>
    let career = { name: "", role: "", pos: 1, div: 3, runs: 0, wicks: 0, matches: 0, myTeam: "" };
    let match = {
        innings: 1, teamRuns: 0, teamWicks: 0, totalBalls: 0,
        playerRuns: 0, playerBalls: 0, playerWicks: 0, playerOvers: 0,
        target: 0, playerActive: false, isBatting: false, matchActive: false,
        opponent: "", lastBowledOver: -1, consecutiveOversBlocked: false
    };

    let teams = [
        { name: "Nagpur Nightriders", points: 0, played: 0 },
        { name: "Butibori Blasters", points: 0, played: 0 },
        { name: "Wardha Warriors", points: 0, played: 0 },
        { name: "Hingna Hurricanes", points: 0, played: 0 },
        { name: "Umred United", points: 0, played: 0 },
        { name: "Kamptee Knights", points: 0, played: 0 }
    ];

    let schedule = [];
    const outcomes = [0, 1, 1, 2, 4, 6, "W", 0, 1];

    function initGame() {
        career.name = document.getElementById('pName').value || "Player";
        career.role = document.getElementById('pRole').value;
        career.pos = parseInt(document.getElementById('pPos').value);
        career.myTeam = document.getElementById('pTeamSelect').value;
        
        let userTeamObj = teams.find(t => t.name === career.myTeam);
        if(userTeamObj) userTeamObj.name += " (You)";

        generateFixtures();
        
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('gameplay').classList.remove('hidden');
        
        let desc = career.role === "Batsman" ? "Score 300 Runs" : career.role === "Bowler" ? "Take 15 Wickets" : "Score 200 Runs & Take 10 Wkts";
        document.getElementById('target-desc').innerText = desc;
        
        prepMatchday();
        updateUI();
    }

    function generateFixtures() {
        let opponents = teams.filter(t => !t.name.includes(career.myTeam)).map(t => t.name.replace(" (You)", ""));
        for (let i = 0; i < 2; i++) {
            opponents.sort(() => Math.random() - 0.5);
            opponents.forEach(opp => schedule.push(opp));
        }
    }

    function prepMatchday() {
        match.opponent = schedule[career.matches];
        document.getElementById('fixture-title').innerText = `Matchday ${career.matches + 1}/10 vs ${match.opponent}`;
        document.getElementById('toss-zone').classList.remove('hidden');
        document.getElementById('action-zone').classList.add('hidden');
    }

    function startToss() {
        const pWinsToss = Math.random() > 0.5;
        const pElectsBat = Math.random() > 0.5;
        match.isBatting = (pWinsToss && pElectsBat) || (!pWinsToss && !pElectsBat);
        
        let choice = match.isBatting ? "Bat" : "Bowl";
        addLog(pWinsToss ? `You won the toss and chose to ${choice} first!` : `${match.opponent} won the toss and chose to ${choice === 'Bat' ? 'Bowl' : 'Bat'} first.`);
        
        match.innings = 1;
        setupInnings();
    }

    function setupInnings() {
        match.teamRuns = 0; match.teamWicks = 0; match.totalBalls = 0;
        match.playerRuns = 0; match.playerBalls = 0; match.playerWicks = 0; match.playerOvers = 0;
        match.playerActive = false;
        match.matchActive = true;
        match.lastBowledOver = -1;
        match.consecutiveOversBlocked = false;

        document.getElementById('toss-zone').classList.add('hidden');
        document.getElementById('action-zone').classList.remove('hidden');
        document.getElementById('tiles').classList.remove('hidden');
        document.getElementById('sim-btn').classList.add('hidden');

        if(match.isBatting) {
            checkBattingEntry();
        } else {
            match.playerActive = (career.role !== "Batsman");
            if(match.playerActive) {
                addLog(`Your team fields. You are in the bowling attack rotation!`);
            } else {
                addLog(`Your team fields. As a pure batsman, you are stationed in the outfield.`);
            }
        }
        updateUI();
    }

    function playBall() {
        if(!match.matchActive) return;

        // Immediate run chase validation check
        if(match.innings === 2 && match.teamRuns >= match.target) {
            nextInnings();
            return;
        }

        let currentOverIndex = Math.floor(match.totalBalls / 6);

        if(match.isBatting && !match.playerActive) {
            simulateTeamBall();
            return;
        }

        if(!match.isBatting && career.role === "Batsman") {
            simulateOpponentBall();
            return;
        }

        if(!match.isBatting && career.role !== "Batsman") {
            if(match.playerOvers >= 24) {
                addLog("You have finished your maximum quota of 4 overs.");
                match.playerActive = false;
                simulateOpponentBall();
                return;
            }

            if(match.lastBowledOver !== -1 && currentOverIndex === (match.lastBowledOver + 1)) {
                if(!match.consecutiveOversBlocked) {
                    addLog(`The captain changes ends. An alternate bowler takes Over ${currentOverIndex + 1}.`);
                    match.consecutiveOversBlocked = true;
                }
                simulateOpponentOver();
                return;
            } else {
                match.consecutiveOversBlocked = false;
            }
        }

        const res = outcomes[Math.floor(Math.random() * outcomes.length)];
        match.totalBalls++;
        
        if(match.isBatting) {
            match.playerBalls++;
            if(res === "W") {
                match.teamWicks++;
                addLog(`<span style="color:red">WICKET! You are OUT caught for ${match.playerRuns} runs.</span>`);
                match.playerActive = false;
                document.getElementById('tiles').classList.add('hidden');
                document.getElementById('sim-btn').classList.remove('hidden');
            } else {
                match.playerRuns += res;
                match.teamRuns += res;
                addLog(`You hit it for ${res} run(s).`);
            }
        } else {
            match.playerOvers++;
            if(res === "W") {
                match.playerWicks++;
                match.teamWicks++;
                addLog(`<span style="color:#4caf50">WICKET! Beautiful length delivery clean bowls the batsman!</span>`);
            } else {
                match.teamRuns += res;
                addLog(`Batsman scores ${res} off your delivery.`);
            }

            if(match.totalBalls % 6 === 0) {
                match.lastBowledOver = Math.floor((match.totalBalls - 1) / 6);
                addLog(`End of your over. Alternate bowler warming up.`);
                
                if(match.playerOvers >= 24) {
                    addLog("Your 4-over bowling quota is complete. You return to the outfield.");
                    document.getElementById('tiles').classList.add('hidden');
                    document.getElementById('sim-btn').classList.remove('hidden');
                }
            }
        }

        updateUI();
        if(match.innings === 2 && match.teamRuns >= match.target) {
            nextInnings();
            return;
        }
        if(match.totalBalls >= 120 || match.teamWicks >= 10) nextInnings();
    }

    function getSimulatedRuns() {
        let currentOver = Math.floor(match.totalBalls / 6);
        let wicketsInHand = 10 - match.teamWicks;
        
        if (currentOver >= 15 && wicketsInHand >= 5) {
            let roll = Math.random();
            if (roll > 0.85) return 6;
            if (roll > 0.65) return 4;
            if (roll > 0.30) return 2;
            return 1;
        }
        if (currentOver < 6) {
            let roll = Math.random();
            if (roll > 0.90) return 6;
            if (roll > 0.75) return 4;
            if (roll > 0.40) return 1;
            return 0;
        }
        if (wicketsInHand >= 7) {
            return Math.random() > 0.65 ? 4 : (Math.random() > 0.20 ? 1 : 0);
        }
        return Math.random() > 0.85 ? 4 : (Math.random() > 0.40 ? 1 : 0);
    }

    function simulateTeamBall() {
        let ballsThisOver = Math.floor(Math.random() * 4) + 3;
        for(let i = 0; i < ballsThisOver; i++) {
            if(match.totalBalls >= 120 || match.teamWicks >= (career.pos - 1)) break;
            if(match.innings === 2 && match.teamRuns >= match.target) break; // Safeguard run-chase boundaries
            match.totalBalls++;
            match.teamRuns += getSimulatedRuns();
            if(Math.random() > 0.95) match.teamWicks++;
        }
        checkBattingEntry();
        updateUI();
        if(match.innings === 2 && match.teamRuns >= match.target) { nextInnings(); return; }
        if(match.totalBalls >= 120 || match.teamWicks >= 10) nextInnings();
    }

    function simulateOpponentBall() {
        if(match.innings === 2 && match.teamRuns >= match.target) {
            nextInnings();
            return;
        }

        let totalRunsThisOver = 0;
        for(let b=0; b<6; b++) {
            if(match.totalBalls >= 120 || match.teamWicks >= 10) break;
            if(match.innings === 2 && match.teamRuns >= match.target) break;
            let deliveryRuns = getSimulatedRuns();
            totalRunsThisOver += deliveryRuns;
            match.teamRuns += deliveryRuns;
            match.totalBalls++;
            if(Math.random() > 0.94) match.teamWicks++;
        }
        
        addLog(`Teammates bowling rotation completed. Over conceded ${totalRunsThisOver} runs.`);
        updateUI();
        
        if(match.innings === 2 && match.teamRuns >= match.target) {
            nextInnings();
            return;
        }
        if(match.totalBalls >= 120 || match.teamWicks >= 10) nextInnings();
    }

    function simulateOpponentOver() {
        for(let i = 0; i < 6; i++) {
            if(match.totalBalls >= 120 || match.teamWicks >= 10) break;
            if(match.innings === 2 && match.teamRuns >= match.target) break;
            
            match.totalBalls++;
            match.teamRuns += getSimulatedRuns();
            if(Math.random() > 0.95) match.teamWicks++;
        }
        addLog(`Teammate finishes their over. Captain calls you back into the spell attack.`);
        updateUI();
        
        if(match.innings === 2 && match.teamRuns >= match.target) {
            nextInnings();
            return;
        }
        if(match.totalBalls >= 120 || match.teamWicks >= 10) nextInnings();
    }

    function checkBattingEntry() {
        const wicketsNeeded = career.pos - 1;
        if(match.teamWicks >= wicketsNeeded) {
            match.playerActive = true;
            addLog(`<b>Wicket falls! Your team is ${match.teamRuns}/${match.teamWicks}. You walk out at No.${career.pos}.</b>`);
        } else {
            addLog(`Pavilion Guard: Team is ${match.teamRuns}/${match.teamWicks}. Waiting for wicket entry slot...`);
        }
    }

    function simRest() {
        while(match.totalBalls < 120 && match.teamWicks < 10) {
            if(match.innings === 2 && match.teamRuns >= match.target) break;
            match.totalBalls++;
            match.teamRuns += getSimulatedRuns();
            if(Math.random() > 0.96) match.teamWicks++;
        }
        nextInnings();
    }

    function nextInnings() {
        if(match.innings === 1) {
            alert("Innings Break!");
            match.target = match.teamRuns + 1;
            match.innings = 2;
            match.isBatting = !match.isBatting;
            setupInnings();
        } else {
            endMatch();
        }
    }

    function endMatch() {
        career.matches++;
        career.runs += match.playerRuns;
        career.wicks += match.playerWicks; 
        
        let win = false;
        if(match.innings === 2) {
            if(match.isBatting) win = match.teamRuns >= match.target;
            else win = match.teamRuns < match.target;
        } else {
            if(match.isBatting) win = match.teamRuns >= match.target;
            else win = match.teamRuns < match.target;
        }

        let userTeamNameInTable = career.myTeam;
        let userTeamObj = teams.find(t => t.name.includes(userTeamNameInTable) || t.name === userTeamNameInTable);
        
        if(win) {
            if(userTeamObj) userTeamObj.points += 2;
            addLog(`Victory! ${career.myTeam} secure 2 league points.`);
        } else {
            let oppIndex = teams.findIndex(t => t.name === match.opponent);
            if(oppIndex !== -1) teams[oppIndex].points += 2;
            addLog(`Defeat. ${match.opponent} takes the points.`);
        }
        
        if(userTeamObj) userTeamObj.played++;
        
        let oppIdx = teams.findIndex(t => t.name === match.opponent);
        if(oppIdx !== -1) teams[oppIdx].played++;

        simulateRestOfLeague();

        alert(`Match Concluded!\nYou scored ${match.playerRuns} runs and took ${match.playerWicks} wickets.`);
        
        match.playerRuns = 0;
        match.playerBalls = 0;
        match.playerWicks = 0;
        match.playerOvers = 0;

        if(career.matches >= 10) {
            checkSeasonOutcome();
        } else {
            match.matchActive = false;
            prepMatchday();
        }
        updateUI();
    }

    function simulateRestOfLeague() {
        let userTeamNameInTable = career.myTeam;
        for(let i=0; i<teams.length; i++) {
            if(teams[i].name !== match.opponent && !teams[i].name.includes(userTeamNameInTable) && Math.random() > 0.4) {
                teams[i].points += 2;
            }
            if(teams[i].played < career.matches) teams[i].played = career.matches;
        }
    }

    function checkSeasonOutcome() {
        let goalMet = false;
        if(career.role === "Batsman" && career.runs >= 300) goalMet = true;
        if(career.role === "Bowler" && career.wicks >= 15) goalMet = true;
        if(career.role === "All-Rounder" && career.runs >= 200 && career.wicks >= 10) goalMet = true;

        if(goalMet && career.div > 1) {
            career.div--;
            alert(`🏆 PROMOTION ACCORDED! You elevated to Division ${career.div}!`);
        } else {
            alert("Season Finished. Targets unmet. Re-playing current Division.");
        }
        
        career.matches = 0; career.runs = 0; career.wicks = 0;
        
        teams.forEach(t => { 
            t.points = 0; t.played = 0; 
            t.name = t.name.replace(" (You)", "");
        });
        
        let freshUserObj = teams.find(t => t.name === career.myTeam);
        if(freshUserObj) freshUserObj.name += " (You)";

        generateFixtures();
        prepMatchday();
    }

    function addLog(msg) {
        const l = document.getElementById('log');
        l.innerHTML = `> ${msg}<br>` + l.innerHTML;
    }

    function updateUI() {
        document.getElementById('stat-runs').innerText = career.runs;
        document.getElementById('stat-wicks').innerText = career.wicks;
        document.getElementById('sc-runs').innerText = match.teamRuns;
        document.getElementById('sc-wicks').innerText = match.teamWicks;
        
        let ov = Math.floor(match.totalBalls / 6);
        let bl = match.totalBalls % 6;
        
        document.getElementById('match-header').innerText = `vs ${match.opponent || 'TBD'}`;
        document.getElementById('sc-overs').innerText = `Innings ${match.innings} | Overs: ${ov}.${bl} / 20.0`;
        document.getElementById('batting-team').innerText = match.isBatting ? `${career.myTeam.toUpperCase()} BATTING` : `${(match.opponent || '').toUpperCase()} BATTING`;
        
        let status = "";
        if(match.isBatting) {
            status = match.playerActive ? `💥 INNINGS LIVE: ${match.playerRuns} runs (${match.playerBalls}b)` : `Padded up. Waiting inside the pavilion at No.${career.pos}`;
        } else {
            if (career.role === "Batsman") {
                status = "🏃 Outfielder (Not designated to bowl)";
            } else {
                let bo = Math.floor(match.playerOvers / 6);
                let bb = match.playerOvers % 6;
                status = match.playerActive ? `🔥 BOWLING SPELL: ${match.playerWicks} Wkts (${bo}.${bb}/4.0 Ov)` : "Spell Finished / Outfield duty";
            }
        }
        document.getElementById('player-status').innerHTML = status;
        document.getElementById('sc-target').innerText = (match.innings === 2) ? `Target: ${match.target}` : "";

        let sortedTeams = [...teams].sort((a,b) => b.points - a.points);
        let html = "";
        sortedTeams.forEach(t => {
            let activeClass = t.name.includes("(You)") ? "class='highlight'" : "";
            html += `<tr ${activeClass}><td>${t.name}</td><td>${t.played}</td><td><b>${t.points}</b></td></tr>`;
        });
        document.getElementById('standings-body').innerHTML = html;
    }
</script>
</body>
</html>
