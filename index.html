
                <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cricket Career Sim Pro</title>
    <style>
        :root { --field: #27ae60; --pitch: #edc9af; --ball: #d35400; }
        body { font-family: 'Arial', sans-serif; background: #222; color: #fff; text-align: center; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: #333; padding: 20px; border-radius: 15px; border: 3px solid var(--field); }
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); background: #111; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 400px; margin: 20px auto; }
        .tile { height: 80px; background: var(--field); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #fff; }
        .tile:hover { background: #2ecc71; transform: scale(1.05); }
        .hidden { display: none; }
        .log { background: #000; height: 150px; overflow-y: auto; padding: 10px; border-radius: 5px; text-align: left; font-family: monospace; margin-top: 15px; }
        button { padding: 12px 25px; background: var(--ball); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .match-info { font-size: 1.2rem; color: #f1c40f; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏏 Cricket Career Simulator</h1>

    <!-- Setup Screen -->
    <div id="setup">
        <input type="text" id="pName" placeholder="Player Name"><br><br>
        <select id="pNation">
            <option value="India">India</option>
            <option value="Australia">Australia</option>
            <option value="England">England</option>
        </select>
        <select id="pRole">
            <option value="Batsman">Specialist Batsman</option>
            <option value="Bowler">Specialist Bowler</option>
            <option value="All-Rounder">All-Rounder</option>
        </select>
        <select id="pPos">
            <option value="1">Opener (Pos 1)</option>
            <option value="3">Top Order (Pos 3)</option>
            <option value="5">Middle Order (Pos 5)</option>
            <option value="7">Finisher (Pos 7)</option>
        </select><br><br>
        <button onclick="startGame()">Start Career</button>
    </div>

    <!-- Match Screen -->
    <div id="gameplay" class="hidden">
        <div class="stats-bar">
            <div>Div: <span id="ui-div">3</span></div>
            <div>Match: <span id="ui-m-count">0</span>/10</div>
            <div>Runs: <span id="ui-s-runs">0</span></div>
            <div>Wickets: <span id="ui-s-wicks">0</span></div>
        </div>

        <div id="toss-area">
            <button onclick="handleToss()">Flip Coin for Toss</button>
        </div>

        <div id="match-area" class="hidden">
            <div class="match-info" id="match-status">First Innings Starting...</div>
            <div class="match-info" id="ball-count">Overs: 0.0 / 20</div>
            
            <div class="tile-grid" id="tiles">
                <div class="tile" onclick="playBall()">?</div>
                <div class="tile" onclick="playBall()">?</div>
                <div class="tile" onclick="playBall()">?</div>
                <div class="tile" onclick="playBall()">?</div>
            </div>
            
            <div id="sim-btn-area" class="hidden">
                <button onclick="simulateRest()">Simulate Remaining Match</button>
            </div>
        </div>

        <div class="log" id="log">Welcome to the professional league!</div>
    </div>
</div>

<script>
    let p = { 
        name: "", role: "", pos: 1, div: 3, 
        sRuns: 0, sWicks: 0, mCount: 0,
        currentInnings: 1, ballsInInnings: 0, isOut: false, battingNow: false, bowlingNow: false
    };

    const outcomes = [0, 1, 2, 4, 6, "OUT", 1, 0, 1]; // Weighted for realism

    function startGame() {
        p.name = document.getElementById('pName').value || "Player";
        p.role = document.getElementById('pRole').value;
        p.pos = parseInt(document.getElementById('pPos').value);
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('gameplay').classList.remove('hidden');
        addLog(`Career started. Targets for Div ${p.div}: Reach goals in 10 matches.`);
    }

    function handleToss() {
        const win = Math.random() > 0.5;
        const choice = Math.random() > 0.5 ? "BATTING" : "BOWLING";
        addLog(win ? `You won the toss and chose ${choice}!` : `Opponent won the toss and chose ${choice}!`);
        
        p.currentInnings = 1;
        p.ballsInInnings = 0;
        p.isOut = false;
        
        // Logic to determine if player starts now
        if(choice === "BATTING") { p.battingNow = (p.pos === 1); p.bowlingNow = false; }
        else { p.battingNow = false; p.bowlingNow = true; }

        document.getElementById('toss-area').classList.add('hidden');
        document.getElementById('match-area').classList.remove('hidden');
        updateUI();
    }

    function playBall() {
        if(p.ballsInInnings >= 120) { nextInnings(); return; }

        // If player is waiting to bat (Position logic)
        if(!p.battingNow && !p.bowlingNow && !p.isOut) {
            // Randomly lose wickets until player's position arrives
            if(Math.random() > 0.8) {
                addLog(`A wicket fell! You are closer to the crease.`);
                p.battingNow = true; 
            } else {
                addLog(`Team is batting... Overs passing.`);
            }
            p.ballsInInnings += 6; // Fast forward overs
        } else {
            let res = outcomes[Math.floor(Math.random() * outcomes.length)];
            p.ballsInInnings++;

            if(res === "OUT") {
                if(p.battingNow) {
                    addLog("<span style='color:red'>You are OUT!</span> Innings simulation starts.");
                    p.isOut = true; p.battingNow = false;
                    showSimButton();
                } else if(p.bowlingNow) {
                    p.sWicks++;
                    addLog("WICKET! You took a scalp!");
                }
            } else {
                if(p.battingNow) p.sRuns += res;
                addLog(`Ball ${p.ballsInInnings}: ${res} runs.`);
            }
        }
        updateUI();
        if(p.ballsInInnings >= 120) nextInnings();
    }

    function nextInnings() {
        if(p.currentInnings === 1) {
            alert("End of 1st Innings. Switching sides.");
            p.currentInnings = 2;
            p.ballsInInnings = 0;
            p.battingNow = !p.battingNow;
            p.bowlingNow = !p.bowlingNow;
            if(p.isOut) p.battingNow = false;
            updateUI();
        } else {
            endMatch();
        }
    }

    function showSimButton() {
        document.getElementById('tiles').classList.add('hidden');
        document.getElementById('sim-btn-area').classList.remove('hidden');
    }

    function simulateRest() {
        p.mCount++;
        alert("Match ended via simulation.");
        resetMatchFlow();
    }

    function endMatch() {
        p.mCount++;
        alert("Match Finished!");
        resetMatchFlow();
    }

    function resetMatchFlow() {
        if(p.mCount >= 10) checkPromotion();
        document.getElementById('match-area').classList.add('hidden');
        document.getElementById('toss-area').classList.remove('hidden');
        document.getElementById('tiles').classList.remove('hidden');
        document.getElementById('sim-btn-area').classList.add('hidden');
        updateUI();
    }

    function checkPromotion() {
        let success = false;
        if(p.role === "Batsman" && p.sRuns >= 300) success = true;
        if(p.role === "Bowler" && p.sWicks >= 15) success = true;
        if(p.role === "All-Rounder" && p.sRuns >= 200 && p.sWicks >= 10) success = true;

        if(success) {
            p.div = Math.max(1, p.div - 1);
            alert("PROMOTED TO DIVISION " + p.div);
        } else {
            alert("Season failed. Try again.");
        }
        p.mCount = 0; p.sRuns = 0; p.sWicks = 0;
    }

    function addLog(msg) {
        const l = document.getElementById('log');
        l.innerHTML = `> ${msg}<br>${l.innerHTML}`;
    }

    function updateUI() {
        document.getElementById('ui-div').innerText = p.div;
        document.getElementById('ui-m-count').innerText = p.mCount;
        document.getElementById('ui-s-runs').innerText = p.sRuns;
        document.getElementById('ui-s-wicks').innerText = p.sWicks;
        let ov = Math.floor(p.ballsInInnings/6);
        let bl = p.ballsInInnings%6;
        document.getElementById('ball-count').innerText = `Innings ${p.currentInnings} | Overs: ${ov}.${bl} / 20`;
    }
</script>
</body>
</html>
