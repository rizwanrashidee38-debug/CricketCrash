
                       <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elite Cricket Career Simulator</title>
    <style>
        :root { --field: #1b5e20; --pitch: #cfb997; --ui-bg: #121212; --accent: #fbc02d; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; margin: 0; text-align: center; }
        .game-wrap { max-width: 900px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 15px; border-top: 5px solid var(--accent); }
        .scoreboard { background: #000; padding: 20px; border-radius: 10px; margin: 15px 0; border: 1px solid #333; }
        .live-num { font-size: 2.5rem; color: var(--accent); font-weight: bold; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; font-size: 0.9rem; color: #bbb; }
        .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 400px; margin: 20px auto; }
        .tile { height: 90px; background: var(--field); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; transition: 0.3s; border: 2px solid transparent; }
        .tile:hover { border-color: white; transform: scale(1.03); }
        .log { background: #111; height: 120px; overflow-y: auto; padding: 15px; text-align: left; font-family: monospace; border-radius: 5px; font-size: 0.85rem; border-left: 3px solid var(--accent); }
        .hidden { display: none; }
        button, select, input { padding: 12px; margin: 5px; border-radius: 5px; border: none; font-size: 1rem; }
        button { background: var(--accent); font-weight: bold; cursor: pointer; }
        .highlight { color: var(--accent); }
    </style>
</head>
<body>

<div class="game-wrap">
    <h1 id="title">🏏 CRICKET CAREER: DIV 3</h1>

    <!-- INITIAL SETUP -->
    <div id="setup">
        <input type="text" id="pName" placeholder="Player Name">
        <select id="pRole">
            <option value="Batsman">Specialist Batsman</option>
            <option value="Bowler">Specialist Bowler</option>
            <option value="All-Rounder">All-Rounder</option>
        </select>
        <select id="pPos">
            <option value="1">Opener (1)</option>
            <option value="3">Top Order (3)</option>
            <option value="5">Middle Order (5)</option>
            <option value="7">Finisher (7)</option>
        </select><br>
        <button onclick="initGame()">Start Professional Career</button>
    </div>

    <!-- MATCH INTERFACE -->
    <div id="gameplay" class="hidden">
        <div class="stats-grid">
            <div>MATCH: <span id="ui-m">1</span>/10</div>
            <div>DIV RUNS: <span id="ui-runs" class="highlight">0</span></div>
            <div>DIV WICKETS: <span id="ui-wicks" class="highlight">0</span></div>
            <div>ROLE: <span id="ui-role"></span></div>
        </div>

        <div id="toss-zone">
            <h3 id="toss-text">Prepare for the Toss</h3>
            <button onclick="startToss()">Flip Coin</button>
        </div>

        <div id="action-zone" class="hidden">
            <div class="scoreboard">
                <div id="batting-team" style="font-weight: bold; letter-spacing: 1px;">TEAM BATTING</div>
                <div class="live-num"><span id="sc-runs">0</span> - <span id="sc-wicks">0</span></div>
                <div id="sc-overs">Overs: 0.0 / 20.0</div>
                <div id="sc-target" class="highlight"></div>
                <hr style="opacity: 0.2">
                <div id="player-status">Waiting in the pavilion...</div>
            </div>

            <div class="tile-grid" id="tiles">
                <div class="tile" onclick="playBall()">?</div>
                <div class="tile" onclick="playBall()">?</div>
                <div class="tile" onclick="playBall()">?</div>
                <div class="tile" onclick="playBall()">?</div>
            </div>
            
            <button id="sim-btn" class="hidden" onclick="simRest()">Simulate Remainder</button>
        </div>

        <div class="log" id="log">Welcome to the career simulator. Good luck!</div>
    </div>
</div>

<script>
    let career = { name: "", role: "", pos: 1, div: 3, runs: 0, wicks: 0, matches: 0 };
    let match = {
        innings: 1, teamRuns: 0, teamWicks: 0, totalBalls: 0,
        playerRuns: 0, playerBalls: 0, playerWicks: 0, playerOvers: 0,
        target: 0, playerActive: false, isBatting: false, matchActive: false
    };

    const outcomes = [0, 1, 1, 2, 4, 6, "W", 0, 1];

    function initGame() {
        career.name = document.getElementById('pName').value || "Player";
        career.role = document.getElementById('pRole').value;
        career.pos = parseInt(document.getElementById('pPos').value);
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('gameplay').classList.remove('hidden');
        document.getElementById('ui-role').innerText = career.role;
        updateUI();
    }

    function startToss() {
        const playerWins = Math.random() > 0.5;
        const playerBats = Math.random() > 0.5;
        match.isBatting = (playerWins && playerBats) || (!playerWins && !playerBats);
        
        let decision = match.isBatting ? "Bat" : "Bowl";
        addLog(playerWins ? `You won the toss and chose to ${decision}!` : `Opponent won the toss and chose to ${decision}!`);
        
        setupInnings();
    }

    function setupInnings() {
        match.teamRuns = 0; match.teamWicks = 0; match.totalBalls = 0;
        match.playerRuns = 0; match.playerBalls = 0; match.playerWicks = 0; match.playerOvers = 0;
        match.playerActive = false;
        match.matchActive = true;

        document.getElementById('toss-zone').classList.add('hidden');
        document.getElementById('action-zone').classList.remove('hidden');
        document.getElementById('tiles').classList.remove('hidden');
        document.getElementById('sim-btn').classList.add('hidden');

        if(match.isBatting) {
            checkBattingEntry();
        } else {
            match.playerActive = (career.role !== "Batsman");
            addLog(match.playerActive ? "You are opening the bowling!" : "Team is bowling. Simulating...");
        }
        updateUI();
    }

    function playBall() {
        if(!match.matchActive) return;

        // If player is not at crease yet (Batting)
        if(match.isBatting && !match.playerActive) {
            simulateTeamBall();
            return;
        }

        // If player is Bowling but has finished 4 overs
        if(!match.isBatting && career.role !== "Batsman" && match.playerOvers >= 24) {
            addLog("You have finished your 4-over spell.");
            match.playerActive = false;
            simulateOpponentBall();
            return;
        }

        const res = outcomes[Math.floor(Math.random() * outcomes.length)];
        match.totalBalls++;
        
        if(match.isBatting) {
            if(res === "W") {
                addLog(`<span style="color:red">WICKET! You are OUT for ${match.playerRuns}</span>`);
                match.teamWicks++;
                match.playerActive = false;
                document.getElementById('tiles').classList.add('hidden');
                document.getElementById('sim-btn').classList.remove('hidden');
            } else {
                match.playerRuns += res;
                match.teamRuns += res;
                match.playerBalls++;
                addLog(`You hit it for ${res} run(s).`);
            }
        } else {
            // Bowling
            match.playerOvers++;
            if(res === "W") {
                match.playerWicks++;
                match.teamWicks++;
                addLog(`<span style="color:#4caf50">WICKET! You got the breakthrough!</span>`);
            } else {
                match.teamRuns += res;
                addLog(`Batsman takes ${res} run(s) off your bowling.`);
            }
        }

        updateUI();
        if(match.totalBalls >= 120 || match.teamWicks >= 10) nextInnings();
    }

    function simulateTeamBall() {
        match.totalBalls += 6; // Simulate in blocks
        if(Math.random() > 0.6) match.teamWicks++;
        match.teamRuns += Math.floor(Math.random() * 10);
        checkBattingEntry();
        updateUI();
    }

    function simulateOpponentBall() {
        match.totalBalls += 6;
        match.teamRuns += Math.floor(Math.random() * 8);
        if(Math.random() > 0.8) match.teamWicks++;
        updateUI();
        if(match.totalBalls >= 120 || match.teamWicks >= 10) nextInnings();
    }

    function checkBattingEntry() {
        const wicketsNeeded = career.pos - 1;
        if(match.teamWicks >= wicketsNeeded) {
            match.playerActive = true;
            addLog("<b>It's your turn! You walk out to the crease.</b>");
        } else {
            addLog(`Team is ${match.teamRuns}/${match.teamWicks}. Waiting for your turn...`);
        }
    }

    function simRest() {
        while(match.totalBalls < 120 && match.teamWicks < 10) {
            match.totalBalls++;
            if(Math.random() > 0.95) match.teamWicks++;
            match.teamRuns += Math.floor(Math.random() * 2);
        }
        nextInnings();
    }

    function nextInnings() {
        if(match.innings === 1) {
            alert("Innings Over!");
            match.target = match.teamRuns + 1;
            match.innings = 2;
            match.isBatting = !match.isBatting;
            setupInnings();
        } else {
            endMatch();
        }
    }

    function endMatch() {
        career.matches++;
        career.runs += match.playerRuns;
        career.wicks += match.playerWicks;
        
        alert(`Match Ended! Total: ${match.teamRuns}/${match.teamWicks}. Your Season Stats: ${career.runs} runs, ${career.wicks} wickets.`);
        
        if(career.matches >= 10) checkProgression();
        
        match.matchActive = false;
        document.getElementById('action-zone').classList.add('hidden');
        document.getElementById('toss-zone').classList.remove('hidden');
        updateUI();
    }

    function checkProgression() {
        let promo = false;
        if(career.role === "Batsman" && career.runs >= 300) promo = true;
        if(career.role === "Bowler" && career.wicks >= 15) promo = true;
        if(career.role === "All-Rounder" && career.runs >= 200 && career.wicks >= 10) promo = true;

        if(promo && career.div > 1) {
            career.div--;
            alert(`CONGRATULATIONS! Promoted to Division ${career.div}`);
        } else if(!promo) {
            alert("Season finished. Targets not met. Stay in current Division.");
        }
        career.matches = 0; career.runs = 0; career.wicks = 0;
    }

    function addLog(msg) {
        const l = document.getElementById('log');
        l.innerHTML = `> ${msg}<br>` + l.innerHTML;
    }

    function updateUI() {
        document.getElementById('ui-m').innerText = career.matches + 1;
        document.getElementById('ui-runs').innerText = career.runs;
        document.getElementById('ui-wicks').innerText = career.wicks;
        document.getElementById('sc-runs').innerText = match.teamRuns;
        document.getElementById('sc-wicks').innerText = match.teamWicks;
        
        let ov = Math.floor(match.totalBalls / 6);
        let bl = match.totalBalls % 6;
        document.getElementById('sc-overs').innerText = `Overs: ${ov}.${bl} / 20.0`;
        
        document.getElementById('batting-team').innerText = match.isBatting ? "YOUR TEAM BATTING" : "OPPONENT BATTING";
        
        let status = "";
        if(match.isBatting) {
            status = match.playerActive ? `BATTING: ${match.playerRuns} (${match.playerBalls})` : "Waiting to bat...";
        } else {
            status = (career.role === "Batsman") ? "Fielding..." : `BOWLING: ${match.playerWicks} Wkts (Overs: ${Math.floor(match.playerOvers/6)}.${match.playerOvers%6}/4)`;
        }
        document.getElementById('player-status').innerHTML = status;
        document.getElementById('sc-target').innerText = (match.innings === 2) ? `Target: ${match.target}` : "";
    }
</script>
</body>
</html>
